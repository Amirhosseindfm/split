name: hamhesab
description: "هم‌حساب - اپلیکیشن مدیریت و تقسیم هزینه‌های گروهی"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local database
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Persian date & numbers
  shamsi_date: ^1.1.1

  # Secure storage (session/token - بخش 39 سند)
  flutter_secure_storage: ^9.2.2

  # Images (Receipt - بخش 46 سند، پیاده‌سازی UI در آینده)
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Connectivity (Offline First - بخش 23 سند، پیاده‌سازی کامل sync در آینده)
  connectivity_plus: ^6.0.3

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # فقط برای Drift codegen لازم است (app_database.g.dart).
  build_runner: ^2.4.11
  drift_dev: ^2.19.1

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
